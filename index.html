<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURY SUEHTAM - Acesso</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#0A0A0A;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;width:100%;max-width:480px;border-radius:20px;overflow:hidden}
.header{background:#0A0A0A;padding:28px;text-align:center;border-bottom:3px solid #D4AF37}
.logo-icon{width:48px;height:48px;background:#D4AF37;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:10px;margin:0 auto 10px}
.header h1{color:#D4AF37;letter-spacing:3px;margin:0}
.form{padding:24px}
label{font-size:11px;font-weight:800;display:block;margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:10px}
.btn{width:100%;background:#D4AF37;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:18px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="header"><div class="logo-icon">GS</div><h1>GURY SUEHTAM</h1></div>
<div class="form">
<form id="leadForm">
<label>NOME *</label><input name="nome" required>
<label>WHATSAPP *</label><input name="whatsapp" required>
<label>INSTRUMENTO</label><select name="instrumento"><option selected>Sax Alto</option><option>Sax Tenor</option></select>
<label>CIDADE</label><input name="cidade">
<label>ORIGEM</label><select name="origem"><option>Instagram</option><option>YouTube</option></select>
<button class="btn" type="submit">LIBERAR MEU EDITOR →</button>
</form>
</div></div>
<script>
const GOOGLE_URL='https://script.google.com/macros/s/AKfycbxWk50hHGMnoYJpnxFnvpyJc2feRJjUUBG6Nla9dH9fA7XhlYGIeoDu1KlpKTBxrHY/exec';
document.getElementById('leadForm').addEventListener('submit', async(e)=>{
 e.preventDefault();
 const data=Object.fromEntries(new FormData(e.target).entries());
 data.data=new Date().toLocaleString('pt-BR');
 await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 fetch(GOOGLE_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(data)});
 localStorage.setItem('gury_lead',JSON.stringify(data));
 window.location.href='/editor-partitura.html';
});
</script>
</body>
</html>
