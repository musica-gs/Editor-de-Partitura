<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURY SUEHTAM - Editor Partitura</title>
<style>
body{margin:0;background:#0A0A0A;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;color:#000;padding:30px;border-radius:16px;width:90%;max-width:400px;text-align:center;border:2px solid #D4AF37}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;padding:14px;background:linear-gradient(135deg,#D4AF37,#B8941F);border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2 style="color:#D4AF37;margin:0">GURY SUEHTAM</h2>
<p style="font-size:12px;letter-spacing:2px">EDITOR DE PARTITURA</p>
<input id="nome" placeholder="Seu nome">
<input id="whats" placeholder="WhatsApp">
<input id="cidade" placeholder="Cidade">
<button onclick="entrar()">LIBERAR MEU EDITOR →</button>
</div>
<script>
async function entrar(){
  const nome=document.getElementById('nome').value;
  const whatsapp=document.getElementById('whats').value;
  const cidade=document.getElementById('cidade').value;
  if(!nome||!whatsapp){alert('Preencha nome e whats');return;}
  localStorage.setItem('gury_lead', JSON.stringify({nome,whatsapp,cidade,data:new Date().toLocaleString('pt-BR')}));
  // Salva no servidor se tiver (Render) - se for Pages ignora o erro
  try{await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,whatsapp,cidade,origem:'landing'})});}catch(e){}
  // CORREÇÃO DO 404: SEM BARRA NA FRENTE
  window.location.href='editor-partitura.html';
}
</script>
</body>
</html>
